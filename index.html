function generateSentence() {
const selectedSounds = Array.from(
  document.querySelectorAll("#soundFilter input:checked")
).map(box => box.value);  const level = document.getElementById("levelSelect").value;


if (selectedSounds.length === 0) {
  document.getElementById("sentence").textContent =
    "Choose at least one sound.";

  document.getElementById("pictures").innerHTML = "";

  return;
}

const filteredTargets =
  selectedSounds.length === 0
    ? []
    : targetWords.filter(item =>
        selectedSounds.includes(`${item.sound}-${item.position}`)
      );

  if (filteredTargets.length === 0) {
    document.getElementById("sentence").textContent = "No words found for that sound.";
    return;
  }

const selectedWord = pickRandom(filteredTargets);
const sound =
  selectedWord.sound === "s-blends"
    ? `${selectedWord.sound}-${selectedWord.position}`
    : selectedWord.sound;
const noun = pickRandom(nouns);
const verb = pickRandom(verbs);

let generatedText = "";

if (level === "word") {
  generatedText = selectedWord.word;
}

const phraseStarters = [
  "the big",
  "my little",
  "a funny",
  "a happy",
  "the green",
  "my favorite",
  "the stinky",
  "three tiny",
  "small yellow",
 "a shiny",
 "the nice",
 "very silly",
 "super sleepy",
 "giant blue",
  "cute blue",
  "I see the",
  "I want a",
  "There is the",
  "Look at the",
  "You have a",
];

if (level === "phrase") {
  const starter = pickRandom(phraseStarters);
  generatedText = `${starter} ${selectedWord.word}`;
}

if (level === "sentence") {
  generatedText = `The ${noun.word} ${verb.word} the ${selectedWord.word}.`;
}

if (level === "word") {
  document.getElementById("sentence").textContent = "";
} else {
  document.getElementById("sentence").textContent = generatedText;
}

     if (level === "sentence") {
  document.getElementById("pictures").innerHTML = `
    <div class="word-card">
      <img src="${noun.image}" alt="${noun.word}" />
      <p>${noun.word}</p>
    </div>

    <div class="word-card">
      <img src="${verb.image}" alt="${verb.word}" />
      <p>${verb.word}</p>
    </div>

    <div class="word-card">
      <img src="${selectedWord.image}" alt="${selectedWord.word}" />
      <p>${selectedWord.word}</p>
    </div>
  `;
} else {
  const promptCard =
    level === "word" && soundPrompts[sound]
      ? `
         <div class="word-card prompt-card">
          <img src="${soundPrompts[sound]}" alt="Sound prompt" />
    
        </div>
      `
      : "";

  document.getElementById("pictures").innerHTML = `
    <div class="word-card">
      <img src="${selectedWord.image}" alt="${selectedWord.word}" />
      <p>${selectedWord.word}</p>
    </div>

    ${promptCard}
  `;
}

makePracticeDots(10);

}

function makePracticeDots(number = 10) {
  const dotsArea = document.getElementById("practiceDots");
  dotsArea.innerHTML = "";

  for (let i = 0; i < number; i++) {
    const dot = document.createElement("button");
    dot.className = "practice-dot";
    dot.textContent = "";

dot.onclick = function () {
  dot.classList.toggle("completed");
  const completed = dot.classList.contains("completed");

  dot.textContent = completed ? "⭐" : "";

  if (completed) {
    const sound = new Audio("sounds/star.mp3");
    sound.volume = 0.8;

    sound.play().catch(error => {
      console.log("Sound did not play. Check the file path:", error);
    });

if (
  document.querySelectorAll(".practice-dot.completed").length === 10
) {

  const celebration = new Audio("sounds/celebration.mp3");
  celebration.volume = 0.8;
  celebration.play();

  confetti({
    particleCount: 800,
    spread: 400,
    startVelocity: 70,
    scalar: 1.5,
    origin: { y: 0.6 }
  });
}
  }
};

dotsArea.appendChild(dot);

  }
}

function resetSounds() {
  const checkboxes = document.querySelectorAll(
    "#soundFilter input[type='checkbox']"
  );

  checkboxes.forEach(box => {
    box.checked = false;
  });

  document.getElementById("sentence").textContent =
    "Press the button!";

  document.getElementById("pictures").innerHTML = "";
document.getElementById("practiceDots").innerHTML = "";
}

</script>
